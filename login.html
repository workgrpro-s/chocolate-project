<input id="code" placeholder="كلمة السر">
<button onclick="login()">دخول</button>

<script>
function login() {
  let code = document.getElementById("code").value;

  // دخول العميل
  if(code === "1234") {
    window.location.href = "index.html";
  }

  // دخول الأدمن
  else if(code === "admin") {
    window.location.href = "admin.html";
  }

  else {
    alert("كلمة السر غلط");
  }
}
</script>
