<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>تسجيل الدخول</title>

<style>
body{
  font-family: Arial;
  background:#222;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  color:white;
}

.box{
  background:#333;
  padding:20px;
  border-radius:12px;
  width:300px;
}

input{
  width:100%;
  padding:10px;
  margin:8px 0;
  border:none;
  border-radius:6px;
}

button{
  width:100%;
  padding:10px;
  background:#4CAF50;
  color:white;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

.switch{
  margin-top:10px;
  text-align:center;
  color:#00aaff;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="box">
<h2 id="title">تسجيل دخول</h2>

<input id="user" placeholder="اسم المستخدم">
<input id="pass" type="password" placeholder="كلمة المرور">

<button onclick="login()">دخول</button>

<div class="switch" onclick="toggle()">
تبديل (تسجيل / إنشاء حساب)
</div>
</div>

<script>
let isLogin = true;

let users = JSON.parse(localStorage.getItem("users")) || [];

function toggle(){
  isLogin = !isLogin;
  document.getElementById("title").innerText =
    isLogin ? "تسجيل دخول" : "إنشاء حساب";
}

function login(){
  let user = document.getElementById("user").value;
  let pass = document.getElementById("pass").value;

  // أدمن ثابت
  if(user === "admin" && pass === "1234"){
    localStorage.setItem("role","admin");
    window.location.href = "admin.html";
    return;
  }

  if(isLogin){
    let found = users.find(u => u.user === user && u.pass === pass);

    if(found){
      localStorage.setItem("role","client");
      window.location.href = "index.html";
    } else {
      alert("خطأ في البيانات");
    }

  } else {
    users.push({user, pass});
    localStorage.setItem("users", JSON.stringify(users));
    alert("تم إنشاء الحساب");
  }
}
</script>

</body>
</html>
