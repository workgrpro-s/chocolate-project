<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>تسجيل الدخول</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo&display=swap" rel="stylesheet">

<style>
:root {
    --main-color: #4a2c11;
    --secondary-color: #d4af37;
    --bg-color: #fcf8f2;
}

body {
    margin: 0;
    font-family: 'Cairo', sans-serif;
    background: var(--bg-color);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.login-box {
    background: white;
    width: 350px;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.1);
    text-align: center;
    border-top: 5px solid var(--secondary-color);
}

.login-box h2 {
    color: var(--main-color);
    margin-bottom: 20px;
}

.login-box input {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-size: 14px;
}

.login-box button {
    width: 100%;
    padding: 10px;
    background: var(--main-color);
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    margin-top: 10px;
}

.login-box button:hover {
    background: #3a220d;
}

.switch {
    margin-top: 10px;
    font-size: 13px;
    color: var(--secondary-color);
    cursor: pointer;
}
</style>
</head>

<body>

<div class="login-box">
    <h2 id="title">تسجيل الدخول</h2>

    <input id="user" placeholder="اسم المستخدم">
    <input id="pass" type="password" placeholder="كلمة المرور">

    <button onclick="login()">دخول</button>

    <div class="switch" onclick="toggle()">
        إنشاء حساب جديد
    </div>
</div>

<script>
let isLogin = true;

// تخزين المستخدمين
let users = JSON.parse(localStorage.getItem("users")) || [];

function toggle(){
    isLogin = !isLogin;
    document.getElementById("title").innerText =
        isLogin ? "تسجيل الدخول" : "إنشاء حساب";
}

function login(){
  let user = document.getElementById("user").value.trim();
  let pass = document.getElementById("pass").value.trim();

  
  if(user === "" || pass === ""){
    alert("لابد من كتابة اسم المستخدم وكلمة المرور");
    return;
  }

  
  if(user === "admin" && pass === "1234"){
    localStorage.setItem("role","admin");
    window.location.href = "admin.html";
    return;
  }

  if(isLogin){
    let found = users.find(u => u.user === user && u.pass === pass);

    if(found){
      localStorage.setItem("role","client");
      window.location.href = "index.html";
    } else {
      alert("خطأ في البيانات");
    }

      } else {
    // 🟢 إنشاء حساب (مع منع التكرار والفراغ)
    let exists = users.find(u => u.user === user);

    if(exists){
      alert("اسم المستخدم موجود مسبقًا");
      return;
    }


  } else {
    // إنشاء حساب
    users.push({user, pass});
    localStorage.setItem("users", JSON.stringify(users));
    alert("تم إنشاء الحساب");
  }
}
</script>

</body>
</html>
